name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Every night against nothingeats-gitops main, so a broken image shows up without a change here.
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      gitops-ref:
        description: Branch, tag or commit of nothingeats-gitops to test
        type: string
        default: main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  system-tests:
    needs: checks
    uses: ./.github/workflows/system-tests.yml
    permissions:
      contents: read
    with:
      gitops-ref: ${{ inputs.gitops-ref || 'main' }}
      e2e-ref: ${{ github.sha }}

  codeql:
    uses: slashncode/nothingeats-ci/.github/workflows/codeql.yml@main
    permissions:
      contents: read
      security-events: write
    with:
      language: javascript-typescript

  pr:
    if: github.event_name == 'pull_request'
    uses: slashncode/nothingeats-ci/.github/workflows/pr-hygiene.yml@main
    permissions:
      contents: read
      pull-requests: write
