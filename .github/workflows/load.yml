# The load test on a throwaway cluster, by hand: the same cluster as the system tests (k3d on the
# runner, Flux from nothingeats-gitops clusters/ci), then k6 with visitors climbing in steps until
# p95 passes a second or errors pass 1 %, and with orders at a tenth of the visitor rate. Orders
# are real (mails, deliveries, rewards), which is why this runs here and not against a laptop's
# cluster. The table per step ends up in the job summary.
name: load

on:
  workflow_dispatch:
    inputs:
      gitops-ref:
        description: Branch, tag or commit of nothingeats-gitops to build the cluster from
        type: string
        default: main
      orders:
        description: Checkouts at a tenth of the visitor rate
        type: boolean
        default: true
      steps:
        description: Visitors per second at each step
        type: string
        default: 10,25,50,100,200,300,400,600,800

permissions: {}

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      E2E_DISPOSABLE_CLUSTER: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: slashncode/nothingeats-gitops
          ref: ${{ inputs.gitops-ref }}
          path: gitops
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Names of the shop on this runner
        run: echo "127.0.0.1 nothingeats.localhost mail.nothingeats.localhost" | sudo tee -a /etc/hosts
      - name: Cluster
        run: scripts/cluster-up.sh gitops
      # Also opens Phantom Pizza around the clock, so there is always a restaurant to order from.
      - name: Playwright
        run: pnpm test
      - name: k6 load
        id: load
        continue-on-error: true
        env:
          ORDERS: ${{ inputs.orders }}
          STEPS: ${{ inputs.steps }}
          SUMMARY_FILE: load-summary.md
        run: pnpm load
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Load: ${{ inputs.orders && 'visitors and orders' || 'visitors' }}"
            cat load-summary.md 2>/dev/null || echo "No summary: k6 did not finish."
            echo
            echo "k6 ended with: ${{ steps.load.outcome }} (a threshold that aborts the run fails the step)."
            echo
            echo '### Pods that restarted (and why)'
            echo '```'
            kubectl -n nothingeats get pods -o custom-columns='POD:.metadata.name,RESTARTS:.status.containerStatuses[0].restartCount,LAST:.status.containerStatuses[0].lastState.terminated.reason' --no-headers | awk '$2 != "0" && $2 != "<none>"' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Diagnose
        if: ${{ !cancelled() }}
        run: scripts/diagnose.sh artifacts/cluster
      - name: Keep the evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load
          path: |
            load-summary.md
            artifacts/
          retention-days: 14
