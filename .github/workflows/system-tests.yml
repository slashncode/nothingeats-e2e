# The whole shop in a throwaway k3d cluster on the runner, built by Flux from one commit of
# nothingeats-gitops (clusters/ci), then tested like a customer would use it: Playwright, then a
# k6 smoke run. The cluster makes its own secrets and talks to no outside service.
#
# Reusable: this repo runs it for its own changes and every night, nothingeats-gitops for its
# changes (with gitops-ref set to the commit under test).
name: system-tests

on:
  workflow_call:
    inputs:
      gitops-ref:
        description: Branch, tag or commit of nothingeats-gitops to build the cluster from
        type: string
        default: main
      e2e-ref:
        description: Branch, tag or commit of nothingeats-e2e with the tests
        type: string
        default: main

permissions: {}

jobs:
  system-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      # The cluster lives for this run only: tests may change content like an admin would.
      E2E_DISPOSABLE_CLUSTER: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: slashncode/nothingeats-e2e
          ref: ${{ inputs.e2e-ref }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: slashncode/nothingeats-gitops
          ref: ${{ inputs.gitops-ref }}
          path: gitops
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Names of the shop on this runner
        run: echo "127.0.0.1 nothingeats.localhost mail.nothingeats.localhost" | sudo tee -a /etc/hosts
      - name: Cluster
        id: cluster
        run: scripts/cluster-up.sh gitops
      - name: Playwright
        run: pnpm test
      - name: k6 smoke
        if: ${{ !cancelled() && steps.cluster.outcome == 'success' }}
        run: pnpm smoke
      - name: Diagnose
        if: failure()
        run: scripts/diagnose.sh artifacts/cluster
      - name: Keep the evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: system-tests
          path: |
            playwright-report/
            test-results/
            artifacts/
          retention-days: 14
